<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Wolf Forge Portal Showreel</title>
<!--
  Wolf Forge Portal — 28s showreel composition (1920x1080, 30fps).
  The story is a user's walk through the app: Dashboard → Projects → Tickets →
  Clients → Invoices → back to Dashboard → the whole workspace → Settings →
  White Label. One in-app camera zooms in on what the user is looking at and
  pulls out to the navigation before each click.

  Every visual is a pure function of time: window.seek(t) poses the whole frame,
  so render.mjs can step it frame by frame. Open with ?t=12.4 to inspect a frame,
  or ?play to watch it in real time.

  Screens in captures/ are real renders of this app (local Supabase, demo data).
  Brand art comes from public/branding, White Label Studio frames from docs/qa.
-->
<style>
  @font-face { font-family: "Sora"; src: url("fonts/sora-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; }
  @font-face { font-family: "Inter"; src: url("fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }

  :root { --navy: #000d51; --gold: #d9a92f; --gold-bright: #f1c85a; --text: #f8f9ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: #01041f; font-family: "Inter", system-ui, sans-serif; color: var(--text); }
  canvas.full { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #grain { mix-blend-mode: overlay; opacity: 0.22; image-rendering: pixelated; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 72% 70% at 50% 50%, rgba(0,0,0,0) 52%, rgba(0,2,14,0.55) 82%, rgba(0,1,8,0.92) 100%); }
  #flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #fff6d8 0%, #f1c85a 45%, rgba(217,169,47,0) 100%); opacity: 0; mix-blend-mode: screen; }
  #world { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .scene { position: absolute; inset: 0; display: none; }
  .persp { perspective: 2200px; perspective-origin: 50% 50%; }
  .p3d { transform-style: preserve-3d; }
  .abs { position: absolute; }

  .kicker { font-family: "Inter"; font-weight: 600; font-size: 26px; letter-spacing: 0.55em; text-transform: uppercase; color: #c9cfe8; white-space: nowrap; }
  .gold-text { background: linear-gradient(180deg, #fff1c2 0%, #f1c85a 32%, #d9a92f 62%, #8f6d22 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sora { font-family: "Sora"; }
  .char { display: inline-block; will-change: transform, opacity, filter; }

  .screen { position: absolute; border-radius: 18px; overflow: hidden; background: #fff;
    box-shadow: 0 0 0 1.5px rgba(241,200,90,0.55), 0 40px 120px rgba(0,0,0,0.65), 0 0 80px rgba(62,108,255,0.18); }
  .screen img { display: block; width: 100%; height: 100%; }
  .layer { position: absolute; overflow: hidden; border-radius: 10px; }
  .layer img { position: absolute; display: block; }

  /* the in-app camera */
  .app { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; border-radius: 16px; overflow: hidden; background: #000d51;
    box-shadow: 0 0 0 1.5px rgba(241,200,90,0.6), 0 50px 140px rgba(0,0,0,0.7), 0 0 90px rgba(62,108,255,0.2); }
  .app > img { position: absolute; inset: 0; width: 1440px; height: 900px; display: block; }
  .ring { position: absolute; border-radius: 10px; border: 2.5px solid #f1c85a; box-shadow: 0 0 22px rgba(241,200,90,0.9), inset 0 0 14px rgba(241,200,90,0.35); opacity: 0; }
  .ripple { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; border: 2px solid #f1c85a; opacity: 0; }
  .cursor { position: absolute; width: 30px; height: 30px; transform-origin: 0 0; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.45)); }

  .lt { position: absolute; left: 110px; bottom: 104px; display: flex; align-items: center; gap: 22px; padding: 18px 34px 18px 22px; border-radius: 22px;
    background: rgba(0, 6, 47, 0.72); backdrop-filter: blur(14px); box-shadow: 0 0 0 1px rgba(241,200,90,0.35), 0 24px 60px rgba(0,0,0,0.5); }
  .lt .idx { font-family: "Sora"; font-weight: 300; font-size: 26px; color: #f1c85a; letter-spacing: 0.08em; padding-right: 22px; border-right: 1px solid rgba(241,200,90,0.4); }
  .lt .lbl { font-family: "Sora"; font-weight: 800; font-size: 56px; letter-spacing: -0.02em; line-height: 1; }

  .phoneFrame { position: absolute; width: 400px; height: 838px; padding: 12px; border-radius: 58px; background: linear-gradient(160deg, #23263a, #07080f 60%);
    box-shadow: 0 0 0 2px rgba(241,200,90,0.45), 0 40px 90px rgba(0,0,0,0.65); }
  .phoneFrame img { width: 376px; height: 814px; border-radius: 46px; display: block; }
  .phoneFrame .notch { position: absolute; left: 50%; top: 24px; width: 112px; height: 32px; margin-left: -56px; border-radius: 20px; background: #05060b; }
</style>
</head>
<body>
<div id="stage">

  <div id="world">

      <div id="hIconWrap" class="abs" style="left:770px;top:350px;width:380px;height:380px">

          <div id="hSweep" class="abs" style="top:-40%;bottom:-40%;width:42%;background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,246,216,0.75) 50%, rgba(255,255,255,0) 100%);transform:rotate(20deg);mix-blend-mode:screen"></div>

  <div id="flash"></div>

  <canvas id="grain" class="full" width="960" height="540"></canvas>

<script>
// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  linear: (k) => k,
  outExpo: (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k)),
  inExpo: (k) => (k <= 0 ? 0 : Math.pow(2, 10 * k - 10)),
  outCubic: (k) => 1 - Math.pow(1 - k, 3),
  inCubic: (k) => k * k * k,
  inOutCubic: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
  inOutQuint: (k) => (k < 0.5 ? 16 * k ** 5 : 1 - Math.pow(-2 * k + 2, 5) / 2),
  inOutExpo: (k) => (k <= 0 ? 0 : k >= 1 ? 1 : k < 0.5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2),
  outBack: (k) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
};
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let r = Math.imul(s ^ (s >>> 15), 1 | s); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
const $ = (id) => document.getElementById(id);
const st = (el, css) => { for (const k in css) el.style[k] = css[k]; };

// ---------- timeline (seconds) — cuts land on the 120 BPM grid of the score ----------
const DURATION = 28;
const SCENES = { sA: [0, 3.5], sB: [3.5, 5.0], sApp: [[5.0, 11.0], [20.0, 23.5]], sD: [11.0, 14.5], sE: [14.5, 18.0], sF: [18.0, 20.0], sH: [23.5, DURATION + 0.01] };
// Spoken-word cues from the placed voice-over (printed by audio/mix.py)
const CUE = { projects: 7.2, tickets: 8.25, clients: 9.11, billing: 10.02, place: 13.13, layers: 14.6, engineered: 16.21, desktop: 18.15, mobile: 19.13, brand: 20.9, colors: 21.96, portal: 23.8, lead: 25.55 };
// POV clicks (no VO) and every hit that flashes / shakes the frame: [time, strength]
const CLICK = { home: 10.85, settings: 20.4 };
const HITS = [[3.5, 1.0], [5.0, 0.3], [11.0, 0.3], [14.5, 0.3], [16.21, 0.55], [18.0, 0.3], [19.13, 0.25], [20.0, 0.25], [CUE.colors, 0.3], [23.5, 1.0]];

// ---------- app camera ----------
// Page coordinates are the 1440x900 CSS pixels the screens were captured at.
// zoom 1 shows the whole app 1600px wide; rx/ry tilt the frame in 3D.
const NAV = { dashboard: [112, 142], projects: [104, 209], tickets: [100, 249], clients: [100, 329], invoices: [104, 436], settings: [100, 810] };
const VIEW = {
  full: [720, 450, 1, 0, 0],
  nav: [600, 430, 1.14, 0, 0],
  far: [720, 450, 0.5, 24, -20],
  kpi: [835, 300, 1.7, 0, 0],
  revenue: [470, 290, 2.3, 0, 0],
  projects: [790, 420, 1.5, 0, 0],
  tickets: [860, 520, 1.55, 0, 0],
  clients: [790, 540, 1.4, 0, 0],
  invoices: [760, 520, 1.65, 0, 0],
  navLow: [470, 640, 1.45, 0, 0],
  settingsTabs: [440, 300, 2.0, 0, 0],
  brand: [330, 250, 1.75, 0, 0],
  wlFull: [720, 450, 1.02, 4, 3],
  push: [720, 470, 3.2, 0, 0],
};
// [time, view, easing into this key]
const CAM = [
  [5.0, 'far'], [5.85, 'full', 'outExpo'], [6.25, 'full'], [6.75, 'revenue', 'inOutExpo'], [6.95, 'revenue'],
  [7.15, 'nav', 'inOutCubic'],
  [CUE.projects + 0.08, 'nav'], [CUE.projects + 0.5, 'projects', 'inOutExpo'], [CUE.tickets - 0.38, 'projects'],
  [CUE.tickets - 0.05, 'nav', 'inOutCubic'], [CUE.tickets + 0.08, 'nav'], [CUE.tickets + 0.5, 'tickets', 'inOutExpo'], [CUE.clients - 0.36, 'tickets'],
  [CUE.clients - 0.05, 'nav', 'inOutCubic'], [CUE.clients + 0.08, 'nav'], [CUE.clients + 0.5, 'clients', 'inOutExpo'], [CUE.billing - 0.36, 'clients'],
  [CUE.billing - 0.05, 'nav', 'inOutCubic'], [CUE.billing + 0.08, 'nav'], [CUE.billing + 0.48, 'invoices', 'inOutExpo'], [CLICK.home - 0.4, 'invoices'],
  [CLICK.home - 0.05, 'nav', 'inOutCubic'], [CLICK.home + 0.05, 'nav'], [11.0, 'full', 'inOutCubic'],
  // second walkthrough: Settings → White Label
  [20.0, 'full'], [20.3, 'navLow', 'outExpo'], [CLICK.settings + 0.05, 'navLow'], [CLICK.settings + 0.4, 'settingsTabs', 'inOutExpo'],
  [CUE.brand - 0.02, 'settingsTabs'], [CUE.brand + 0.02, 'brand', 'linear'], [CUE.colors - 0.1, 'brand'], [CUE.colors + 0.55, 'wlFull', 'inOutCubic'],
  [22.95, 'wlFull'], [23.5, 'push', 'inExpo'],
];
function camAt(t) {
  let i = 0;
  while (i < CAM.length - 1 && CAM[i + 1][0] <= t) i++;
  const a = CAM[i], b = CAM[Math.min(i + 1, CAM.length - 1)];
  const k = b === a ? 0 : (E[b[2] || 'inOutCubic'])(prog(t, a[0], b[0]));
  return VIEW[a[1]].map((v, j) => lerp(v, VIEW[b[1]][j], k));
}
// Which screen is showing: [from time, page]
const PAGES = [[0, 'dashboard'], [CUE.projects + 0.06, 'orders'], [CUE.tickets + 0.06, 'tickets'], [CUE.clients + 0.06, 'clients'], [CUE.billing + 0.06, 'invoices'],
  [CLICK.home + 0.06, 'dashboard'], [20.0, 'dashboard'], [CLICK.settings + 0.06, 'settings'], [CUE.brand, 'wl']];
// Cursor path in page coords: [time, x, y]; clicks ripple on arrival
const CURSOR = [
  [5.9, 1000, 760], [6.6, 540, 330], [6.95, 520, 320],
  [CUE.projects - 0.02, ...NAV.projects], [CUE.projects + 0.45, 300, 420],
  [CUE.tickets - 0.02, ...NAV.tickets], [CUE.tickets + 0.45, 300, 520],
  [CUE.clients - 0.02, ...NAV.clients], [CUE.clients + 0.45, 300, 560],
  [CUE.billing - 0.02, ...NAV.invoices], [CUE.billing + 0.45, 330, 560],
  [CLICK.home - 0.02, ...NAV.dashboard], [11.0, 300, 300],
  [20.0, 600, 560], [CLICK.settings - 0.02, ...NAV.settings], [CLICK.settings + 0.4, 360, 380], [CUE.brand, 360, 380], [CUE.brand + 0.4, 300, 175], [CUE.colors + 0.6, 520, 420],
];
const CLICKS = [CUE.projects, CUE.tickets, CUE.clients, CUE.billing, CLICK.home, CLICK.settings, CUE.colors - 0.08];
// Gold focus rings on what the camera is looking at: [from, to, x0, y0, x1, y1]
const RINGS = [
  [6.6, 7.05, 271, 184, 544, 369],
  [CUE.projects + 0.45, CUE.tickets - 0.35, 1098, 300, 1206, 332],
  [CUE.tickets + 0.45, CUE.clients - 0.33, 848, 512, 916, 541],
  [CUE.clients + 0.45, CUE.billing - 0.33, 1205, 607, 1282, 633],
  [CUE.billing + 0.42, CLICK.home - 0.35, 694, 499, 746, 523],
  [CLICK.settings + 0.35, CUE.brand - 0.05, 340, 168, 535, 196],
];
// Lower thirds: the user's path through the app
const LT = [[5.85, CUE.projects, '01', 'Dashboard'], [CUE.projects, CUE.tickets, '02', 'Projects'], [CUE.tickets, CUE.clients, '03', 'Tickets'],
  [CUE.clients, CUE.billing, '04', 'Clients'], [CUE.billing, CLICK.home, '05', 'Billing'], [CLICK.settings, CUE.brand, '06', 'Settings']];

function track(path, t) {
  if (t <= path[0][0]) return path[0].slice(1);
  for (let i = 0; i < path.length - 1; i++) {
    const a = path[i], b = path[i + 1];
    if (t < b[0]) { const k = E.inOutCubic(prog(t, a[0], b[0])); return [lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
  }
  return path[path.length - 1].slice(1);
}

// ---------- text helpers ----------
function splitChars(el, text) {
  el.innerHTML = '';
  return [...text].map((ch) => { const s = document.createElement('span'); s.className = 'char'; s.textContent = ch === ' ' ? ' ' : ch; el.appendChild(s); return s; });
}
const bTop = splitChars($('bTitleTop'), 'WOLF FORGE');
bTop.forEach((s) => s.classList.add('gold-text'));
const bBot = splitChars($('bTitleBot'), 'PORTAL');

// ---------- mesh gradient ----------
const mesh = $('mesh').getContext('2d');
function drawMesh(t, mood) {
  const W = 480, H = 270;
  mesh.globalCompositeOperation = 'source-over';
  mesh.fillStyle = '#01041f'; mesh.fillRect(0, 0, W, H);
  const blobs = [
    { c: [0, 13, 81], a: 0.95, r: 260, x: 0.3 + 0.12 * Math.sin(t * 0.31), y: 0.4 + 0.15 * Math.cos(t * 0.27) },
    { c: [27, 60, 255], a: 0.42 * mood.blue, r: 210, x: 0.78 + 0.1 * Math.cos(t * 0.23 + 1), y: 0.3 + 0.14 * Math.sin(t * 0.37) },
    { c: [217, 169, 47], a: 0.30 * mood.gold, r: 170, x: 0.55 + 0.18 * Math.sin(t * 0.19 + 2), y: 0.78 + 0.08 * Math.cos(t * 0.41) },
    { c: [58, 31, 140], a: 0.35, r: 190, x: 0.12 + 0.08 * Math.cos(t * 0.29 + 3), y: 0.85 + 0.1 * Math.sin(t * 0.33) },
    { c: [23, 92, 64], a: 0.55 * mood.green, r: 240, x: 0.5 + 0.2 * Math.sin(t * 0.5), y: 0.5 + 0.1 * Math.cos(t * 0.45) },
    { c: [62, 108, 255], a: 0.22 * mood.blue, r: 150, x: 0.92 + 0.05 * Math.sin(t * 0.6), y: 0.88 + 0.06 * Math.cos(t * 0.52) },
  ];
  mesh.globalCompositeOperation = 'lighter';
  for (const b of blobs) {
    if (b.a <= 0.001) continue;
    const g = mesh.createRadialGradient(b.x * W, b.y * H, 0, b.x * W, b.y * H, b.r);
    g.addColorStop(0, `rgba(${b.c},${b.a})`); g.addColorStop(0.55, `rgba(${b.c},${b.a * 0.35})`); g.addColorStop(1, `rgba(${b.c},0)`);
    mesh.fillStyle = g; mesh.fillRect(0, 0, W, H);
  }
  mesh.globalCompositeOperation = 'source-over';
  mesh.fillStyle = `rgba(0,0,0,${1 - mood.bright})`; mesh.fillRect(0, 0, W, H);
}

// ---------- embers ----------
const emb = $('embers').getContext('2d');
const EMBERS = (() => { const r = rng(7); return Array.from({ length: 150 }, () => ({ x: r() * 1920, y: r() * 1300, sp: 30 + r() * 120, sz: 0.8 + r() * 2.6, ph: r() * 6.28, sw: 10 + r() * 40, f: 0.3 + r() * 1.2, tw: 1 + r() * 4 })); })();
function drawEmbers(t, amount, boost) {
  emb.clearRect(0, 0, 1920, 1080);
  if (amount <= 0) return;
  for (const p of EMBERS) {
    const y = ((p.y - t * p.sp * (1 + boost * 3)) % 1300 + 1300) % 1300 - 110;
    const x = p.x + Math.sin(t * p.f + p.ph) * p.sw;
    const a = amount * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * p.tw + p.ph)));
    const r = p.sz * 4;
    const g = emb.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(255,232,170,${a})`); g.addColorStop(0.3, `rgba(241,200,90,${a * 0.6})`); g.addColorStop(1, 'rgba(217,169,47,0)');
    emb.fillStyle = g; emb.fillRect(x - r, y - r, r * 2, r * 2);
  }
}

const PLATES = (() => { const out = []; const r = rng(99); for (let i = 0; i < 10; i++) { const im = grain.createImageData(960, 540); const d = im.data; for (let j = 0; j < d.length; j += 4) { const v = 128 + (r() + r() + r() - 1.5) * 150; d[j] = d[j + 1] = d[j + 2] = v; d[j + 3] = 255; } out.push(im); } return out; })();

// ---------- per-scene posing ----------
function poseA(t) {
  const k = prog(t, 0.1, 3.3);
  const reveal = E.inOutCubic(prog(t, 0.15, 2.4));
  const push = E.inExpo(prog(t, 3.05, 3.5));
  const scale = lerp(1.22, 1.0, E.outCubic(k)) + push * 2.4;
  st($('aWolfWrap'), { transform: `translateY(${-70 * (1 - push)}px) scale(${scale * 0.74})`, opacity: String(clamp(prog(t, 0.05, 0.9)) * (1 - push)), filter: `blur(${push * 18}px)` });
  const edge = lerp(-20, 120, reveal);
  const mask = `linear-gradient(100deg, #000 ${edge - 12}%, rgba(0,0,0,0) ${edge + 6}%)`;
  st($('aWolf'), { webkitMaskImage: mask, maskImage: mask });
  const sweep = lerp(-30, 130, E.inOutCubic(prog(t, 0.4, 2.9)));
  const band = `linear-gradient(100deg, rgba(0,0,0,0) ${sweep - 9}%, #000 ${sweep}%, rgba(0,0,0,0) ${sweep + 9}%)`;
  st($('aWolfGlow'), { webkitMaskImage: band, maskImage: band, opacity: '0.95' });
  const l1 = E.outCubic(prog(t, 0.45, 1.3)), l2 = E.outCubic(prog(t, 1.3, 2.1)), out = prog(t, 2.95, 3.3);
  st($('aLine1'), { opacity: String(l1 * (1 - out)), letterSpacing: lerp(1.1, 0.55, l1) + 'em', filter: `blur(${(1 - l1) * 8}px)` });
  st($('aLine2'), { opacity: String(l2 * (1 - out)), letterSpacing: lerp(1.1, 0.55, l2) + 'em', filter: `blur(${(1 - l2) * 8}px)` });
}

function poseB(t) {
  const lt = t - 3.5;
  bTop.forEach((s, i) => {
    const k = E.outExpo(prog(lt, i * 0.03, i * 0.03 + 0.4));
    st(s, { transform: `translateZ(${lerp(900, 0, k)}px) translateY(${lerp(40, 0, k)}px)`, opacity: String(clamp(k * 1.6)), filter: `blur(${(1 - k) * 22}px)` });
  });
  bBot.forEach((s, i) => {
    const k = E.outCubic(prog(lt, 0.3 + i * 0.05, 0.75 + i * 0.05));
    st(s, { opacity: String(k), transform: `translateY(${lerp(30, 0, k)}px)`, filter: `blur(${(1 - k) * 10}px)` });
  });
  // the camera dives through the title into the app
  const dive = E.inExpo(prog(t, 4.6, 5.0));
  st($('bTitle'), { transform: `scale(${lerp(1, 1.05, prog(lt, 0, 1.1)) + dive * 5})`, opacity: String(1 - dive), filter: `blur(${dive * 16}px)` });
  st($('bWolf'), { transform: `scale(${lerp(1.5, 1.65, prog(lt, 0, 1.5)) + dive * 3})`, opacity: String(0.13 * (1 - dive)) });
}

function poseApp(t) {
  const [cx, cy, z, rx, ry] = camAt(t);
  const S = z * (1600 / 1440);
  st($('app'), { transform: `translate(960px, 540px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${S}) translate(${-cx}px, ${-cy}px)` });
  // pages: quick cross-fade on navigation, like a real route change
  let cur = PAGES[0], prev = null;
  for (const p of PAGES) if (t >= p[0]) { prev = cur; cur = p; }
  const fade = prev ? E.outCubic(prog(t, cur[0], cur[0] + 0.14)) : 1;
  const wipe = E.inOutCubic(prog(t, CUE.colors - 0.08, CUE.colors + 0.6));
  for (const img of APP_PAGES) {
    const name = img.dataset.page;
    let o = 0;
    if (name === cur[1]) o = fade; else if (prev && name === prev[1]) o = 1;
    if (name === 'wlGreen') o = t >= CUE.colors - 0.1 && t < 23.6 ? 1 : 0;
    st(img, { opacity: String(o), zIndex: name === cur[1] ? '2' : name === 'wlGreen' ? '3' : '1' });
  }
  // recolor radiates from the real Brand colors control
  st(APP_PAGES.find((i) => i.dataset.page === 'wlGreen'), { clipPath: `circle(${wipe * 1800}px at 290px 168px)` });
  // cursor (constant on-screen size) + click ripple
  const [mx, my] = track(CURSOR, t);
  let press = 0, ripple = -1;
  for (const c of CLICKS) { const d = t - c; if (d > -0.05 && d < 0.5) { press = Math.max(press, d < 0.12 ? Math.sin(prog(d, -0.05, 0.12) * Math.PI) : 0); if (d >= 0) ripple = d; } }
  const cursorOn = (t >= 5.9 && t < 11.0) || (t >= 20.05 && t < 22.9);
  st($('cursor'), { left: mx + 'px', top: my + 'px', opacity: cursorOn ? '1' : '0', transform: `scale(${(1 - press * 0.18) / S})`, zIndex: '6' });
  if (ripple >= 0) {
    const k = E.outCubic(prog(ripple, 0, 0.5));
    st($('ripple'), { left: mx + 'px', top: my + 'px', opacity: String((1 - k) * 0.9), transform: `scale(${1 + k * 6})`, zIndex: '5' });
  } else $('ripple').style.opacity = '0';
  // focus ring
  let ring = null;
  for (const r of RINGS) if (t >= r[0] - 0.05 && t < r[1] + 0.15) ring = r;
  if (ring) {
    const k = E.outBack(prog(t, ring[0], ring[0] + 0.25)) * (1 - prog(t, ring[1], ring[1] + 0.15));
    const pad = 6;
    st($('ring'), { left: ring[2] - pad + 'px', top: ring[3] - pad + 'px', width: ring[4] - ring[2] + pad * 2 + 'px', height: ring[5] - ring[3] + pad * 2 + 'px', opacity: String(clamp(k)), transform: `scale(${lerp(1.15, 1, clamp(k))})`, zIndex: '4' });
  } else $('ring').style.opacity = '0';
  // lower third
  let lt = null;
  for (const l of LT) if (t >= l[0] && t < l[1]) lt = l;
  if (lt) {
    const k = E.outExpo(prog(t, lt[0], lt[0] + 0.35));
    $('ltIdx').textContent = lt[2]; $('ltLbl').textContent = lt[3];
    st($('lt'), { opacity: String(k), transform: `translateX(${lerp(-60, 0, k)}px)` });
  } else st($('lt'), { opacity: '0' });
  // brand words over the White Label Studio
  const w1 = E.outExpo(prog(t, CUE.brand - 0.05, CUE.brand + 0.4)), w2 = E.outExpo(prog(t, CUE.colors - 0.05, CUE.colors + 0.4));
  const out = prog(t, 22.95, 23.3);
  st($('appScrim'), { opacity: String(Math.max(w1, lt ? 0.6 : 0) * (1 - out)) });
  st($('gW1'), { opacity: String(w1 * (1 - out)), transform: `translateY(${lerp(50, 0, w1)}px)`, filter: `blur(${(1 - w1) * 10}px)` });
  st($('gW2'), { opacity: String(w2 * (1 - out)), transform: `translateY(${lerp(50, 0, w2)}px) scale(${lerp(1.3, 1, w2)})`, filter: `blur(${(1 - w2) * 10}px)` });
  st($('app'), { filter: `blur(${E.inExpo(prog(t, 23.1, 23.5)) * 10}px)` });
}

function poseD(t) {
  const out = E.inOutQuint(prog(t, 11.05, 12.0));
  const merge = E.inOutQuint(prog(t, CUE.place - 0.15, CUE.place + 0.95));
  const spreadK = out * (1 - merge);
  const rx = lerp(0, 50, spreadK), rz = lerp(0, -22, spreadK);
  const scale = lerp(D_FULL, 0.52, spreadK);
  const drift = lerp(0, 1, prog(t, 11.5, CUE.place)) * 160 * spreadK;
  st($('dPlane'), { transform: `rotateX(${rx}deg) rotateZ(${rz}deg) scale(${scale}) translateY(${-drift}px)` });
  for (const tile of D_TILES) {
    const x = tile.c * 768 - 360, y = tile.r * 498 - 225;
    const wave = Math.sin(t * 2 + tile.seed * 6) * 18 * spreadK;
    st(tile.el, { transform: `translate3d(${x}px, ${y}px, ${(tile.center ? 2 : 0) + wave}px)`, opacity: String(tile.center ? 1 : clamp(spreadK * 1.6)) });
  }
  const k1 = E.outCubic(prog(t, 11.3, 11.9));
  st($('dKicker'), { opacity: String(k1 * (1 - merge)), letterSpacing: lerp(1, 0.55, k1) + 'em' });
  const k2 = E.outExpo(prog(t, CUE.place - 0.08, CUE.place + 0.4)), o2 = prog(t, 14.05, 14.4);
  st($('dScrim'), { opacity: String(k2 * (1 - o2)) });
  st($('dBig'), { opacity: String(k2 * (1 - o2)), transform: `scale(${lerp(1.4, 1, k2)})`, filter: `blur(${(1 - k2) * 16 + o2 * 10}px)` });
}

function poseE(t) {
  const tilt = E.inOutCubic(prog(t, 14.55, 15.3));
  const collapse = E.inExpo(prog(t, CUE.engineered - 0.32, CUE.engineered));
  const flat = E.outExpo(prog(t, CUE.engineered, CUE.engineered + 0.58));
  const r = tilt * (1 - flat);
  const orbit = lerp(-6, 22, prog(t, 15.0, CUE.engineered));
  const exit = E.inExpo(prog(t, 17.65, 18.0));
  const zoom = lerp(1, 1.06, prog(t, CUE.engineered, 17.65));
  st($('eRig'), { transform: `translateX(${-exit * 2200}px) scale(${lerp(lerp(1, 0.8, flat), 0.8, r) * zoom}) translateY(${flat * 70}px) rotateX(${54 * r}deg) rotateZ(${(-34 - orbit) * r}deg)`, filter: `blur(${exit * 10}px)` });
  for (const L of E_LAYERS) {
    if (L.base) { st(L.el, { filter: `brightness(${lerp(1, 0.45, r)})`, boxShadow: '0 40px 120px rgba(0,0,0,.6)' }); continue; }
    const lift = E.outExpo(prog(t, 14.75 + L.d, 15.6 + L.d)) * (1 - collapse);
    const hover = Math.sin(t * 3 + L.z) * 10 * lift;
    st(L.el, { transform: `translateZ(${(L.z * 4.2) * lift + hover}px)`, boxShadow: `0 ${20 * lift}px ${60 * lift}px rgba(0,0,0,${0.55 * lift}), 0 0 0 ${1.5 * lift}px rgba(241,200,90,${0.8 * lift})` });
  }
  const k1 = E.outExpo(prog(t, CUE.layers, CUE.layers + 0.5)), o1 = prog(t, CUE.engineered - 0.22, CUE.engineered);
  st($('eText1'), { opacity: String(k1 * (1 - o1)), transform: `translateY(${lerp(60, 0, k1)}px)`, filter: `blur(${(1 - k1) * 12}px)` });
  const k2 = E.outExpo(prog(t, CUE.engineered, CUE.engineered + 0.45));
  st($('eText2'), { opacity: String(k2 * (1 - exit)), transform: `translateX(${lerp(260, 0, k2) - exit * 1200}px) skewX(${lerp(-14, 0, k2)}deg)` });
}

function poseF(t) {
  const lt = t - 18.0;
  const enter = E.outExpo(prog(lt, 0, 0.55));
  const ph = E.outBack(prog(t, CUE.mobile - 0.05, CUE.mobile + 0.5));
  const ph2 = E.outBack(prog(t, CUE.mobile + 0.08, CUE.mobile + 0.62));
  const exit = E.inExpo(prog(t, 19.72, 20.0));
  st($('fDesk'), { transform: `translateX(${lerp(1400, 0, enter)}px) rotateY(${lerp(-30, 14, enter) + lt * 2}deg) scale(${lerp(1, 0.94, ph) + exit * 0.3})`, opacity: String(1 - exit), filter: `brightness(${lerp(1, 0.7, ph)})` });
  st($('fPhone1'), { transform: `translateY(${lerp(1100, 0, ph) - exit * 200}px) rotate(${lerp(14, -4, ph)}deg)`, opacity: String(1 - exit) });
  st($('fPhone2'), { transform: `translateY(${lerp(1100, 0, ph2) - exit * 260}px) rotate(${lerp(18, 6, ph2)}deg)`, opacity: String(1 - exit) });
  const k1 = E.outCubic(prog(t, CUE.desktop - 0.1, CUE.desktop + 0.35)), k2 = E.outCubic(prog(t, CUE.mobile, CUE.mobile + 0.35));
  st($('fK1'), { opacity: String(k1 * (1 - exit)), letterSpacing: lerp(1, 0.55, k1) + 'em' });
  st($('fK2'), { opacity: String(k2 * (1 - exit)), letterSpacing: lerp(1, 0.55, k2) + 'em' });
}

function poseH(t) {
  const lt = t - 23.5;
  const pop = E.outBack(prog(lt, 0, 0.55));
  const slide = E.inOutCubic(prog(t, CUE.portal - 0.05, CUE.portal + 0.75));
  const fade = E.inCubic(prog(t, DURATION - 0.8, DURATION));
  st($('hIconWrap'), { transform: `translateX(${-slide * 420}px) scale(${lerp(0.4, 1, pop) * lerp(1, 0.78, slide)})`, opacity: String(clamp(pop * 2) * (1 - fade)) });
  st($('hGlow'), { opacity: String((0.6 + 0.4 * Math.sin(lt * 3)) * clamp(pop)), transform: `scale(${1 + 0.06 * Math.sin(lt * 2)})` });
  st($('hSweep'), { left: lerp(-60, 160, E.inOutCubic(prog(lt, 0.25, 1.1))) + '%' });
  const ring = E.outExpo(prog(lt, 0, 1.4));
  st($('hRing'), { transform: `translate(-50%,-50%) scale(${ring * 160})`, opacity: String((1 - ring) * 0.9), borderWidth: lerp(3, 0.05, ring) + 'px' });
  const w = E.outExpo(prog(t, CUE.portal + 0.15, CUE.portal + 0.95));
  st($('hWordWrap'), { left: lerp(900, 740, slide) + 'px', opacity: String(1 - fade) });
  st($('hWord'), { transform: `translateY(${lerp(320, 0, w)}px)`, filter: `blur(${(1 - w) * 8}px)` });
  const p = E.outCubic(prog(t, CUE.portal + 0.45, CUE.portal + 1.2));
  st($('hPortal'), { opacity: String(p), letterSpacing: lerp(1.6, 0.95, p) + 'em' });
  const tg = E.outCubic(prog(t, CUE.lead - 0.05, CUE.lead + 0.6));
  st($('hTag'), { opacity: String(tg * (1 - fade)), letterSpacing: lerp(1.2, 0.55, tg) + 'em', filter: `blur(${(1 - tg) * 6}px)` });
}

const POSE = { sA: poseA, sB: poseB, sApp: poseApp, sD: poseD, sE: poseE, sF: poseF, sH: poseH };

function moodAt(t) {
  const green = Math.sin(Math.PI * prog(t, CUE.colors - 0.2, 23.5)) * 1.0;
  const intro = E.outCubic(prog(t, 0, 1.2));
  const outro = 1 - E.inCubic(prog(t, DURATION - 0.7, DURATION));
  return { blue: 1 - green * 0.6, gold: (t > 23.5 ? 1.6 : 1) * (1 - green * 0.5), green, bright: clamp(intro * outro * (t < 3.5 ? 0.7 : 1)) };
}

// ---------- frame ----------
window.seek = function seek(t) {
  for (const id in SCENES) {
    const spans = Array.isArray(SCENES[id][0]) ? SCENES[id] : [SCENES[id]];
    const on = spans.some(([a, b]) => t >= a && t < b);
    $(id).style.display = on ? 'block' : 'none';
    if (on) POSE[id](t);
  }
  let flash = 0, shake = 0;
  for (const [ht, s] of HITS) { const d = t - ht; if (d >= -0.02 && d < 0.6) { flash = Math.max(flash, s * Math.exp(-d * 9)); shake = Math.max(shake, s * Math.exp(-d * 7)); } }
  const r = rng(Math.floor(t * 30) + 1);
  const breathe = 1 + 0.004 * Math.sin(t * 0.9);
  $('world').style.transform = `translate(${(r() - 0.5) * 28 * shake}px, ${(r() - 0.5) * 28 * shake}px) scale(${breathe + shake * 0.025})`;
  $('flash').style.opacity = String(clamp(flash * 0.85));
  const mood = moodAt(t);
  drawMesh(t, mood);
  const emberAmt = (t < 3.5 ? E.outCubic(prog(t, 0.3, 2)) : t >= 23.5 ? 1 : 0.35) * mood.bright;
  drawEmbers(t, emberAmt, t >= 23.5 ? Math.exp(-(t - 23.5) * 2) : 0);
  grain.putImageData(PLATES[Math.floor(t * 30) % PLATES.length], 0, 0);
  $('grain').style.transform = `translate(${(r() - 0.5) * 6}px, ${(r() - 0.5) * 6}px) scale(1.01)`;
  $('vignette').style.opacity = String(0.92 + 0.08 * Math.sin(t * 1.3));
};
window.DURATION = DURATION;

window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => (im.complete ? im.decode().catch(() => {}) : new Promise((res) => { im.onload = im.onerror = res; }))));
  return true;
})();

const q = new URLSearchParams(location.search);
window.ready.then(() => {
  if (q.has('play')) { const t0 = performance.now(); const loop = () => { const t = ((performance.now() - t0) / 1000) % DURATION; window.seek(t); requestAnimationFrame(loop); }; loop(); }
  else window.seek(parseFloat(q.get('t') || '0'));
});
</script>
