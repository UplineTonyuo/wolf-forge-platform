name: ecfd4d9 remaining validation only - no deployment
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: validation-only-ecfd4d9
  cancel-in-progress: false
jobs:
  database:
    name: local Supabase pgTAP and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2d0b14d67b8d083d9d6b8a0566c8fca0eb227941
          persist-credentials: false
      - name: verify exact source and isolated runner
        run: |-
          test "$GITHUB_REPOSITORY" = 'UplineTonyuo/wolf-forge-platform'
          test "$GITHUB_REF" = 'refs/heads/codex/validate-qa-ecfd4d9-20261030'
          test "$(git rev-parse HEAD)" = '2d0b14d67b8d083d9d6b8a0566c8fca0eb227941'
          test -z "$(git status --porcelain)"
          test -z "$SUPABASE_ACCESS_TOKEN"
          test -z "$VERCEL_TOKEN"
          printf 'Validated source: %s\n' "$(git rev-parse HEAD)"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: start isolated local Supabase database
        run: npx supabase start --yes
      - name: full pgTAP and RLS suite
        run: npm run test:db
      - name: real PostgREST client support isolation and missing-hook checks
        run: node scripts/qa/check-client-support-rest.mjs
      - name: real Storage Team voice upload and media inspection
        run: >-
          node node_modules/vitest/vitest.mjs run --config scripts/qa/team-voice-vitest.config.ts
          --reporter=verbose
      - name: stop runner-owned database
        if: always()
        run: npx supabase stop --no-backup
      - name: verify tracked source and exact Next-generated type changes
        if: always()
        run: >-
          node --input-type=module <<'NODE'

          import assert from 'node:assert/strict';

          import {execFileSync} from 'node:child_process';

          import {readFileSync} from 'node:fs';

          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'});

          assert.equal(git('rev-parse','HEAD').trim(),"2d0b14d67b8d083d9d6b8a0566c8fca0eb227941");

          assert.equal(git('diff','--cached','--name-only').trim(),'');

          const changed=git('diff','--name-only').trim().split('\n').filter(Boolean);

          assert.ok(changed.every(path=>['next-env.d.ts','tsconfig.json'].includes(path)), 'Unexpected tracked
          source change');

          for(const path of changed){
           const original=git('show','HEAD:'+path),actual=readFileSync(path,'utf8');
           if(path==='next-env.d.ts') assert.equal(actual,original.replaceAll('"./.next/types/','"./.next-studio-qa/types/'));
           else {
            const expected=JSON.parse(original);
            expected.include.push('.next-studio-qa/types/**/*.ts','.next-studio-qa/dev/types/**/*.ts');
            assert.deepEqual(JSON.parse(actual),expected);
           }
          }

          console.log(JSON.stringify({source:"2d0b14d67b8d083d9d6b8a0566c8fca0eb227941",applicationPreserved:true,allowedExactGeneratedChanges:changed}));

          NODE
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref ==
      'refs/heads/codex/validate-qa-ecfd4d9-20261030' && github.repository ==
      'UplineTonyuo/wolf-forge-platform'
    env: {}
  intake:
    name: real Auth, purchase, intake, signature, start and PDF
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref ==
      'refs/heads/codex/validate-qa-ecfd4d9-20261030' && github.repository ==
      'UplineTonyuo/wolf-forge-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: '--max-old-space-size=3072'
      NEXT_TELEMETRY_DISABLED: '1'
      WOLF_FORGE_STUDIO_QA_BUILD: '1'
      SENTRY_URL: http://127.0.0.1:1
      SENTRY_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: 2d0b14d67b8d083d9d6b8a0566c8fca0eb227941
      - name: verify exact source and isolated runner
        run: |-
          test "$GITHUB_REPOSITORY" = 'UplineTonyuo/wolf-forge-platform'
          test "$GITHUB_REF" = 'refs/heads/codex/validate-qa-ecfd4d9-20261030'
          test "$(git rev-parse HEAD)" = '2d0b14d67b8d083d9d6b8a0566c8fca0eb227941'
          test -z "$(git status --porcelain)"
          test -z "$SUPABASE_ACCESS_TOKEN"
          test -z "$VERCEL_TOKEN"
          printf 'Validated source: %s\n' "$(git rev-parse HEAD)"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: validate the exact template package
        run: node scripts/qa/intake-workflow-e2e.mjs --check-fixtures
      - name: migrate fresh local Supabase with real Auth and private Storage
        run: |
          if ! npx supabase start --yes >"$RUNNER_TEMP/intake-supabase-start.log" 2>&1; then
            echo "Local Supabase startup failed; raw output is retained only on this disposable runner."
            exit 1
          fi
      - name: install Chromium on the runner
        run: npx playwright install --with-deps chromium
      - name: ensure independent PDF text extraction on the runner
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
      - name: build the production app with inert build settings
        env:
          SUPABASE_URL: http://127.0.0.1:1
          SUPABASE_PUBLISHABLE_KEY: build-only-nonsecret-placeholder
        run: npm run build
      - name: verify packaged PDF fonts
        run: node scripts/qa/assert-pdf-font-trace.mjs
      - name: prepare branch-bound copy of pinned intake assertions
        run: >-
          node --input-type=module <<'NODE'

          import assert from 'node:assert/strict';

          import {readFileSync,writeFileSync,existsSync} from 'node:fs';

          import {createHash} from 'node:crypto';

          const src='scripts/qa/intake-workflow-e2e.mjs',dst='scripts/qa/intake-workflow-validation-only.mjs';

          const hash=x=>createHash('sha256').update(x).digest('hex');

          assert.equal(process.env.GITHUB_REF_NAME,"codex/validate-qa-ecfd4d9-20261030");

          assert.equal(process.env.GITHUB_HEAD_REF||'','');

          const original=readFileSync(src,'utf8');

          assert.equal(hash(original),"baac0532f9b8b49497cf8fb27e0385caf88ac34a33c48082ab4163c697cebaa0");

          const needle="need((process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME) ===
          \"codex/intake-publication-20261028\", \"Unapproved workflow
          branch\");",replacement="need(!process.env.GITHUB_HEAD_REF && process.env.GITHUB_REF_NAME ===
          \"codex/validate-qa-ecfd4d9-20261030\", \"Unapproved validation workflow branch\");";

          assert.equal(original.split(needle).length,2);

          const copy=original.replace(needle,replacement);

          assert.equal(copy.replace(replacement,needle),original);

          assert.equal(hash(copy),"cf8e5b6b0cbca90c31c1246f468fc7fd247a04a8e3edb2f5a906259bf92503df");

          assert.equal(existsSync(dst),false);

          writeFileSync(dst,copy,'utf8');

          console.log(JSON.stringify({sourceHash:hash(original),runnerCopyHash:hash(copy),onlyRunnerChange:'exact
          branch guard',source:"2d0b14d67b8d083d9d6b8a0566c8fca0eb227941"}));

          NODE
      - name: run the actual authenticated Next workflow for all 59 services and 37 templates
        run: node scripts/qa/intake-workflow-validation-only.mjs
      - name: upload synthetic screenshots, PDFs and redacted summary only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecfd4d9-followup-isolated-intake
          path: |
            artifacts/intake-workflow/*.png
            artifacts/intake-workflow/*.pdf
            artifacts/intake-workflow/summary.json
          if-no-files-found: ignore
          retention-days: 1
      - name: stop runner-owned local services
        if: always()
        run: npx supabase stop --no-backup
      - name: verify tracked source and exact Next-generated type changes
        if: always()
        run: >-
          node --input-type=module <<'NODE'

          import assert from 'node:assert/strict';

          import {execFileSync} from 'node:child_process';

          import {readFileSync} from 'node:fs';

          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'});

          assert.equal(git('rev-parse','HEAD').trim(),"2d0b14d67b8d083d9d6b8a0566c8fca0eb227941");

          assert.equal(git('diff','--cached','--name-only').trim(),'');

          const changed=git('diff','--name-only').trim().split('\n').filter(Boolean);

          assert.ok(changed.every(path=>['next-env.d.ts','tsconfig.json'].includes(path)), 'Unexpected tracked
          source change');

          for(const path of changed){
           const original=git('show','HEAD:'+path),actual=readFileSync(path,'utf8');
           if(path==='next-env.d.ts') assert.equal(actual,original.replaceAll('"./.next/types/','"./.next-studio-qa/types/'));
           else {
            const expected=JSON.parse(original);
            expected.include.push('.next-studio-qa/types/**/*.ts','.next-studio-qa/dev/types/**/*.ts');
            assert.deepEqual(JSON.parse(actual),expected);
           }
          }

          console.log(JSON.stringify({source:"2d0b14d67b8d083d9d6b8a0566c8fca0eb227941",applicationPreserved:true,allowedExactGeneratedChanges:changed}));

          NODE
