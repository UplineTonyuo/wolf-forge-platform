# Security CI (D-101). Every job fails the build on a finding — fails closed.
#
# Three independent checks, deliberately separate jobs so one failure does not
# hide the others:
#
#   dependencies   `npm audit` over PRODUCTION dependencies at high+.
#                  Dev-only advisories do not ship to a user and would train
#                  everyone to ignore a red build.
#   secrets        gitleaks over FULL history (fetch-depth: 0) plus the
#                  repo-local scanner over tracked files. History matters:
#                  a credential deleted in a later commit is still published.
#   controls       the security test suites, so a header, CSP or cookie policy
#                  regression is caught the same way any other regression is.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory against unchanged code is still found.
    - cron: "0 22 * * 0"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm audit (production, high and above)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history. A secret removed in a later commit is still leaked.
          fetch-depth: 0
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: repository secret scanner
        run: npm run security:secrets

  controls:
    name: security controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: security control suites
        run: >-
          npx vitest run
          src/tests/security-controls.test.ts
          src/tests/login-brute-force-boundaries.test.ts
          src/tests/auth-cookie-policy.test.ts
          src/tests/safe-next-path.test.ts
