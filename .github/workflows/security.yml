# Wolf Forge CI security gates. Every job fails closed and is independent so
# the Actions summary identifies the failed boundary without hiding later jobs.
name: security

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      database_only:
        description: Recheck SQL and secrets after a test-only database correction
        type: boolean
        default: false
      call_acceptance:
        description: Run real call Realtime/SSE acceptance against a disposable runner-local stack
        type: boolean
        default: false
      call_acceptance_only:
        description: Recheck the compiled transport and secrets after the same candidate passes full PR gates
        type: boolean
        default: false
  schedule:
    # Recheck unchanged dependencies and repository history every week.
    - cron: "0 22 * * 0"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || (!inputs.database_only && !inputs.call_acceptance_only)) }}
    name: TypeScript compile boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Next 16 generates the global PageProps/LayoutProps helpers on demand.
      # A fresh CI checkout has no .next/types until typegen runs.
      - run: npx next typegen && npm run typecheck

  lint:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || (!inputs.database_only && !inputs.call_acceptance_only)) }}
    name: static lint boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  build:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || !inputs.database_only) }}
    name: compiled app and PDF font trace
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      NEXT_TELEMETRY_DISABLED: "1"
      WOLF_FORGE_STUDIO_QA_BUILD: "1"
      SUPABASE_URL: http://127.0.0.1:1
      SUPABASE_PUBLISHABLE_KEY: build-only-nonsecret-placeholder
      SENTRY_URL: http://127.0.0.1:1
      SENTRY_DISABLE_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/qa/assert-pdf-font-trace.mjs
      - run: node --test scripts/qa/check-ticket-call-transport.test.mjs
      - name: start disposable call transport backend
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.call_acceptance }}
        id: call_backend
        run: npx supabase start --yes
      - name: real Auth, private Realtime and compiled-app SSE acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.call_acceptance }}
        run: env -u SUPABASE_URL -u SUPABASE_PUBLISHABLE_KEY node scripts/qa/check-ticket-call-transport.mjs
      - name: remove only the runner-local call stack
        if: ${{ always() && steps.call_backend.outcome != 'skipped' && github.event_name == 'workflow_dispatch' && inputs.call_acceptance }}
        run: npx supabase stop --no-backup

  tests:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || (!inputs.database_only && !inputs.call_acceptance_only)) }}
    name: JavaScript and TypeScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Use Vitest's repository-wide include patterns. A hand-maintained list
      # previously omitted most auth, RBAC, Team, IDOR, webhook and privacy tests.
      - name: full Vitest discovery
        run: npm test

  database:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || !inputs.call_acceptance_only) }}
    name: local Supabase pgTAP and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: start isolated local Supabase database
        id: supabase
        run: npx supabase start --yes
      - name: replay released chat baseline then apply the required-form guard
        run: |
          npx supabase db reset --local --version 20261110153809
          npx supabase migration up --local
      # `test:db` is pinned to `supabase test db --local`; no linked project or
      # hosted connection string is available to this job.
      - name: full pgTAP and RLS suite
        run: npm run test:db
      - name: full database function lint
        run: npm run lint:db
      - name: real PostgREST client support isolation and missing-hook checks
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: node scripts/qa/check-client-support-rest.mjs
      - name: real Storage Team voice upload and media inspection
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: node node_modules/vitest/vitest.mjs run --config scripts/qa/team-voice-vitest.config.ts --reporter=verbose
      - name: real manual invoice receipts, public links and concurrent settlement
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: node scripts/qa/check-invoice-manual-payments-rest.mjs
      # The calling races commit synthetic Auth prerequisites across physical
      # connections. Keep them after REST probes that require an empty database.
      - name: overlapping calling transactions
        run: node scripts/qa/ticket-call-concurrency.mjs

  dependencies:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || (!inputs.database_only && !inputs.call_acceptance_only)) }}
    name: production dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm audit (production, high and above)
        run: npm run audit:deps

  secrets:
    name: repository and history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: refuse incompatible or incomplete targeted dispatch inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DATABASE_ONLY: ${{ inputs.database_only }}
          CALL_ACCEPTANCE: ${{ inputs.call_acceptance }}
          CALL_ACCEPTANCE_ONLY: ${{ inputs.call_acceptance_only }}
        run: |
          if [ "$CALL_ACCEPTANCE_ONLY" = true ] && { [ "$DATABASE_ONLY" = true ] || [ "$CALL_ACCEPTANCE" != true ]; }; then
            echo "::error::Transport-only validation requires call_acceptance=true and database_only=false."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          # Full history. A secret removed in a later commit is still leaked.
          fetch-depth: 0
      # The convenience action narrows PR/push scans to first-parent ranges.
      # Run the official image directly with no log range so Gitleaks uses its
      # full-history/all-refs default. Verbose findings remain 100% redacted.
      - name: gitleaks (all refs and full history, redacted output)
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git --redact --no-banner --no-color --verbose /repo
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: tracked-file secret scanner (redacted by construction)
        run: npm run security:secrets
